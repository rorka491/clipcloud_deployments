services:
  api:
    build: .
    command: uv run uvicorn api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "8004:8000"
    depends_on:
      - postgres

  bot:
    build: .
    command: uv run python bot.py
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: